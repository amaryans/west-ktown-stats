name: File stat suggestions

# Turns "new" rows in the stat_suggestions table (entered on the site's Stats
# tab) into GitHub issues, then marks them as filed with the issue number.
#
# Runs on a schedule, on demand from the Actions tab, and instantly when a
# Supabase Database Webhook sends a repository_dispatch (see README).
#
# Required repository secrets:
#   SUPABASE_URL                e.g. https://xxxx.supabase.co
#   SUPABASE_SERVICE_ROLE_KEY   Project Settings -> API (keep private)

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [stat-suggestion]

permissions:
  contents: read
  issues: write

concurrency:
  group: file-stat-suggestions
  cancel-in-progress: false

jobs:
  file:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run file-suggestions
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
